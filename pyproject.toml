[project]
name = "phylotreegui"
version = "1.0.0"
description = "A Tkinter/Matplotlib GUI for exploring phylogenetic HOR (Higher Order Repeat) trees."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Paolo Pagliuca", email = "paolo.pagliuca@istc.cnr.it" },
]
dependencies = [
    "matplotlib>=3.8",
    "biopython>=1.79",
    "numpy",
    "pandas",
    "seaborn",
    "colour",
    "click>=8.0",
]

[project.scripts]
phylotreegui = "phylotreegui.cli:main"

[tool.uv]
# Use uv-managed CPython (which bundles a modern Tk 8.6) instead of the macOS
# system Python, whose deprecated system Tk 8.5 renders the GUI extremely slowly.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phylotreegui"]
